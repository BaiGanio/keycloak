<!DOCTYPE html>
<html>
<head>
    <title>Weather SPA</title>
</head>
<body>
    <h1>Weather Dashboard <button onclick="fetchWeather()">Fetch</button></h1>
    <div id="content"></div>

    <script>
        async function fetchWeather() {
            const params = new URLSearchParams({
                'grant_type': 'client_credentials',
                'client_id': 'weather-service',
                'client_secret': 'kkg-xxx-xxx-xxx' // Replace with your actual client secret
            });

            const tokenRes = await fetch('http://localhost:8080/realms/demo-realm/protocol/openid-connect/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });

            const tokenData = await tokenRes.json();

            if (!tokenRes.ok) {
                console.error("Keycloak Error:", tokenData); // This will show why the secret failed
                return;
            }

            console.log("Token received!");

            const weatherRes = await fetch('http://localhost:5146/weatherforecast', {
                headers: { 'Authorization': `Bearer ${tokenData.access_token}` }
            });

            if (weatherRes.status === 401) {
                console.error("API rejected the token. Check Authority/Issuer in .NET.");
                return;
            }

            const data = await weatherRes.json();

            // Generate a clean HTML table
            let html = `
                <style>
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: sans-serif; }
                    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
                    th { background-color: #f4f4f4; }
                    tr:nth-child(even) { background-color: #fafafa; }
                </style>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Temp (C)</th>
                            <th>Temp (F)</th>
                            <th>Summary</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(item => `
                            <tr>
                                <td>${new Date(item.date).toLocaleDateString()}</td>
                                <td>${item.temperatureC}°</td>
                                <td>${item.temperatureF}°</td>
                                <td><strong>${item.summary}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            document.getElementById('content').innerHTML = html;
        }
    </script>
</body>
</html>
