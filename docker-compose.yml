services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Disposable local-only credentials for swagger@baiganio.io.
      BGAPI_SWAGGER_PASSWORD: SwaggerTest123!
      REALM_FRONTEND_URL: http://localhost:8080
      SWAGGER_REDIRECT_URI_PUBLIC: https://api.baiganio.io/swagger/oauth2-redirect.html
      SWAGGER_REDIRECT_URI_AZURE: https://bgapi.azurewebsites.net/swagger/oauth2-redirect.html
      SWAGGER_REDIRECT_URI_LOCAL: https://localhost:44364/swagger/oauth2-redirect.html
      SWAGGER_ORIGIN_PUBLIC: https://api.baiganio.io
      SWAGGER_ORIGIN_AZURE: https://bgapi.azurewebsites.net
      SWAGGER_ORIGIN_LOCAL: https://localhost:44364
      BAIGANIO_REDIRECT_URI_PUBLIC: https://baiganio.github.io/
      BAIGANIO_REDIRECT_URI_LOCAL: http://localhost:4299/
      BAIGANIO_ORIGIN_PUBLIC: https://baiganio.github.io
      BAIGANIO_ORIGIN_LOCAL: http://localhost:4299
      COSMIC_ORIGINS_REDIRECT_URI_PUBLIC: https://baiganio.github.io/cosmic-origins/
      COSMIC_ORIGINS_REDIRECT_URI_LOCAL: http://localhost:4300/
      COSMIC_ORIGINS_ORIGIN_PUBLIC: https://baiganio.github.io
      COSMIC_ORIGINS_ORIGIN_LOCAL: http://localhost:4300
    volumes:
      - ./k8s/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  keycloak_postgres_data:
