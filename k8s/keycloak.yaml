apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: keycloak
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: keycloak
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --import-realm
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KCRAW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: postgres-password
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "1"
            - name: KC_DB_POOL_MIN_SIZE
              value: "1"
            - name: KC_DB_POOL_MAX_SIZE
              value: "10"
            - name: KC_HOSTNAME
              value: https://auth.baiganio.io
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KCRAW_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: bootstrap-admin-password
            - name: BGAPI_SWAGGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: bgapi-swagger-password
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "false"
            - name: KC_LOG_LEVEL
              value: INFO
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=70
            - name: REALM_FRONTEND_URL
              value: https://auth.baiganio.io
            - name: SWAGGER_REDIRECT_URI_PUBLIC
              value: https://api.baiganio.io/swagger/oauth2-redirect.html
            - name: SWAGGER_REDIRECT_URI_AZURE
              value: https://bgapi.azurewebsites.net/swagger/oauth2-redirect.html
            - name: SWAGGER_REDIRECT_URI_LOCAL
              value: https://localhost:44364/swagger/oauth2-redirect.html
            - name: SWAGGER_ORIGIN_PUBLIC
              value: https://api.baiganio.io
            - name: SWAGGER_ORIGIN_AZURE
              value: https://bgapi.azurewebsites.net
            - name: SWAGGER_ORIGIN_LOCAL
              value: https://localhost:44364
            - name: BAIGANIO_REDIRECT_URI_PUBLIC
              value: https://baiganio.github.io/
            - name: BAIGANIO_REDIRECT_URI_LOCAL
              value: http://localhost:4299/
            - name: BAIGANIO_ORIGIN_PUBLIC
              value: https://baiganio.github.io
            - name: BAIGANIO_ORIGIN_LOCAL
              value: http://localhost:4299
            - name: COSMIC_ORIGINS_REDIRECT_URI_PUBLIC
              value: https://baiganio.github.io/cosmic-origins/
            - name: COSMIC_ORIGINS_REDIRECT_URI_LOCAL
              value: http://localhost:4300/
            - name: COSMIC_ORIGINS_ORIGIN_PUBLIC
              value: https://baiganio.github.io
            - name: COSMIC_ORIGINS_ORIGIN_LOCAL
              value: http://localhost:4300
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 72
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: realm-import
          configMap:
            name: realm-import
