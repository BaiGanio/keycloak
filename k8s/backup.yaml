apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: keycloak
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: keycloak
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: keycloak
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: keycloak
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/part-of: keycloak
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: keycloak
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: keycloak
                - name: PGUSER
                  value: keycloak
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-credentials
                      key: postgres-password
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  target="/backup/keycloak-$(date -u +%Y%m%dT%H%M%SZ).dump"

                  pg_dump --format=custom --compress=9 --file="$target"
                  pg_restore --list "$target" > /dev/null
                  echo "wrote and verified $target"

                  find /backup \
                    -maxdepth 1 \
                    -name 'keycloak-*.dump' \
                    -type f \
                    -mtime "+$BACKUP_RETENTION_DAYS" \
                    -delete

                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 70
                runAsNonRoot: true
                runAsUser: 70
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
