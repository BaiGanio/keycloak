apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-public-origin
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: keycloak
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Host: auth.baiganio.io
      X-Forwarded-Port: "443"
      X-Forwarded-Proto: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: keycloak
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: keycloak-keycloak-public-origin@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: auth.baiganio.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
